<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해커톤 · 오후 4:20 마감</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: grid; place-items: center;
    background: #ffffff; color: #20242a;
    font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    letter-spacing: 0;
    min-height: 100svh; padding: 80px 20px 40px;
  }
  main { display: grid; justify-items: center; gap: 28px; width: min(100%, 1100px); text-align: center; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .target { font-size: 22px; color: #616b76; }
  .time {
    color: #034898;
    font-variant-numeric: tabular-nums;
    font-weight: 700; line-height: 1;
    font-size: 180px;
    white-space: nowrap;
  }
  .bar { width: 100%; height: 6px; background: #e9edf2; border-radius: 3px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: #034898; transition: width 1s linear; }
  body.soon .time { color: #a85b00; }
  body.soon .fill { background: #a85b00; }
  body.done .time { color: #bf3030; }
  body.done .fill { background: #bf3030; }
  .submission { margin: 0; font-size: 36px; font-weight: 700; color: #034898; }
  .schedule { margin: 0; font-size: 22px; color: #616b76; }
  body.done .submission { color: #bf3030; }
  @media (max-width: 1100px) { .time { font-size: 120px; } }
  @media (max-width: 700px) {
    .time { font-size: 64px; }
    h1 { font-size: 22px; }
    .submission { font-size: 26px; }
    .target, .schedule { font-size: 18px; }
  }
  @media (max-width: 360px) { .time { font-size: 52px; } }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
  button {
    position: fixed; top: 16px; right: 16px;
    width: 40px; height: 40px; display: grid; place-items: center;
    background: transparent; color: #616b76; border: 1px solid #d7dde5; border-radius: 8px; cursor: pointer;
  }
  button:hover { color: #034898; border-color: #034898; }
</style>
</head>
<body>
<button id="fs" title="전체 화면" aria-label="전체 화면">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
</button>
<main>
  <h1>해커톤 제출 마감까지</h1>
  <div class="target" id="target">11월 3일 · 오후 4:20 마감</div>
  <div class="time" id="time" role="timer" aria-live="off">--:--:--</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <p class="submission" id="submission" role="status">오후 3시부터 제출 가능</p>
  <p class="schedule">제출 시간 · 오후 3:00 ~ 4:20</p>
</main>
<script>
  const start = Date.parse("2026-11-03T12:20:00+09:00");
  const opens = Date.parse("2026-11-03T15:00:00+09:00");
  const target = Date.parse("2026-11-03T16:20:00+09:00");
  const total = target - start;
  const pad = n => String(n).padStart(2, "0");
  const timeEl = document.getElementById("time");
  const fillEl = document.getElementById("fill");
  const submissionEl = document.getElementById("submission");

  function tick() {
    const now = Date.now();
    const left = target - now;
    const status = left <= 0 ? "지금 올리면 '지연'으로 표시됩니다" : now >= opens ? "지금 제출 가능합니다" : "오후 3시부터 제출 가능";
    if (submissionEl.textContent !== status) submissionEl.textContent = status;
    if (left <= 0) {
      timeEl.textContent = "00:00:00";
      fillEl.style.width = "100%";
      document.body.className = "done";
      document.title = "해커톤 제출 마감";
      return;
    }
    const s = Math.ceil(left / 1000);
    const text = pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60);
    timeEl.textContent = text;
    document.title = text + " · 16:20까지";
    fillEl.style.width = (100 * Math.max(0, Math.min(1, 1 - left / total))).toFixed(2) + "%";
    document.body.className = s <= 300 ? "soon" : "";
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  tick();

  document.getElementById("fs").onclick = () =>
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
</script>
</body>
</html>
